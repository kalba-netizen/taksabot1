<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b8e3a3"><title>Taksabot — Пиксельный двор</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--ink:#20271d;--cream:#fff0c3;--green:#78b95b;--line:#252b20}*{box-sizing:border-box}body{margin:0;background:#f3d58b;color:var(--ink);font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.8}main{max-width:760px;margin:auto;padding:12px}.panel{border:4px solid var(--line);box-shadow:5px 5px 0 #55472d;background:var(--cream);padding:12px;margin-bottom:14px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-size:15px;line-height:1.6}.small{font-size:8px}.scene{height:310px;position:relative;overflow:hidden;border:4px solid var(--line);background:linear-gradient(#bde7f0 0 48%,#8bcf68 48% 100%);image-rendering:pixelated}.sun{position:absolute;right:32px;top:25px;width:38px;height:38px;background:#ffdc5b;box-shadow:0 0 0 5px #f5b74c}.cloud{position:absolute;left:36px;top:42px;width:90px;height:20px;background:#fff5d4;box-shadow:20px -12px #fff5d4,40px 0 #fff5d4}.fence{position:absolute;bottom:70px;width:100%;height:40px;background:repeating-linear-gradient(90deg,#dba96c 0 16px,#66492c 16px 20px);border-block:5px solid #66492c}.house{position:absolute;right:28px;bottom:78px;width:100px;height:85px;background:#e9bd80;border:5px solid #5a3d2a}.roof{position:absolute;right:15px;bottom:158px;width:126px;height:30px;background:#b85c43;transform:skewY(-22deg);border:4px solid #5a3d2a}.door{position:absolute;right:61px;bottom:78px;width:30px;height:49px;background:#9c6742;border:4px solid #5a3d2a}.flower{position:absolute;bottom:40px;font-size:24px}.dog{position:absolute;left:24%;bottom:48px;width:220px;max-width:55%;filter:drop-shadow(4px 5px 0 #35412b)}.grass{position:absolute;bottom:0;height:45px;width:100%;background:repeating-linear-gradient(90deg,#5fa64b 0 9px,#70b955 9px 18px)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bar{height:14px;border:3px solid var(--line);background:#eee4bd}.fill{height:100%;background:#ed8065;width:100%}.joy{background:#e9c74d}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button{border:3px solid var(--line);background:#8ecb6d;box-shadow:3px 3px 0 var(--line);padding:12px 7px;font:inherit;font-size:9px;cursor:pointer;color:var(--ink)}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}button:disabled{opacity:.45}.log{min-height:32px;font-size:8px}.footer{font-size:7px;text-align:center;color:#51452c}@media(max-width:430px){body{font-size:8px}.brand{font-size:12px}.scene{height:270px}.dog{left:12%;max-width:60%}.buttons{grid-template-columns:repeat(2,1fr)}button{font-size:8px;padding:10px 4px}}
</style></head><body><main>
<header class="panel head"><div><div class="brand">TAKSABOT</div><div class="small">ПИКСЕЛЬНЫЙ ДВОР</div></div><div id="balance">ЖЕТОНЫ: 100</div></header>
<section class="scene panel" style="padding:0;margin-bottom:14px"><div class="sun"></div><div class="cloud"></div><div class="roof"></div><div class="house"></div><div class="door"></div><div class="fence"></div><div class="grass"></div><svg class="dog" viewBox="0 0 260 150" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path fill="#874b28" d="M30 72h30V52h20V42h100v10h24v20h18v20h-20v18h-18v20h-20v-20H90v20H68v-20H50V90H30z"/><path fill="#a96536" d="M72 52h110v20H72zM60 72h150v20H60z"/><path fill="#60371f" d="M40 72h20v18H40zM80 42h18v22H80zM178 52h20v18h-20zM210 72h16v20h-16z"/><path fill="#e5b477" d="M94 62h60v12H94zM110 74h40v10h-40z"/><path fill="#171b16" d="M184 65h8v8h-8zM218 78h8v8h-8z"/><path fill="#f4d9a0" d="M198 86h22v8h-22z"/><path fill="#60371f" d="M70 100h22v28H70zM156 100h22v28h-22zM66 124h30v8H66zM152 124h30v8h-30z"/><path fill="#874b28" d="M22 72h24v10H22zM12 64h18v10H12z"/></svg><div class="flower" style="left:8%">✿</div><div class="flower" style="left:65%">✿</div></section>
<section class="panel"><div class="head"><span>ТВОЯ ТАКСА</span><span id="level">УРОВЕНЬ 0</span></div><p id="dogname">Имя: Такса</p><div class="stats"><div>ГОЛОД <span id="hungerText">100/100</span><div class="bar"><div class="fill" id="hungerBar"></div></div></div><div>РАДОСТЬ <span id="joyText">100/100</span><div class="bar"><div class="fill joy" id="joyBar"></div></div></div></div></section>
<section class="panel"><div style="margin-bottom:10px">ЧТО ДЕЛАЕМ?</div><div class="buttons"><button onclick="play()">ИГРАТЬ +10</button><button onclick="feed()">ПОКОРМИТЬ −10</button><button onclick="work()">РАБОТАТЬ +50</button><button onclick="renameDog()">ИМЯ −500</button></div></section>
<section class="panel"><div>СООБЩЕНИЕ</div><p class="log" id="log">Такса рада тебя видеть! Нажми «Играть».</p><div class="small">Прогресс сохраняется в этом браузере.</div></section><div class="footer">TAKSABOT • АВТОНОМНАЯ ВЕРСИЯ</div>
</main><script>
const $=id=>document.getElementById(id);let s;try{s=JSON.parse(localStorage.getItem('taksabot-save'))}catch(e){};s=s||{balance:100,name:'Такса',hunger:100,joy:100,level:0,last:Date.now()};
function save(msg){s.hunger=Math.max(0,s.hunger);s.joy=Math.max(0,s.joy);localStorage.setItem('taksabot-save',JSON.stringify(s));$('balance').textContent='ЖЕТОНЫ: '+s.balance;$('dogname').textContent='Имя: '+s.name;$('level').textContent='УРОВЕНЬ '+s.level;$('hungerText').textContent=s.hunger+'/100';$('joyText').textContent=s.joy+'/100';$('hungerBar').style.width=s.hunger+'%';$('joyBar').style.width=s.joy+'%';if(msg)$('log').textContent=msg}
function play(){if(s.joy>=100){save('Такса уже очень счастлива!');return}s.joy=Math.min(100,s.joy+10);save('Вы поиграли вместе. Такса счастлива!')}
function feed(){if(s.balance<100){save('Не хватает жетонов на корм.');return}if(s.hunger>65){save('Такса пока не голодна.');return}s.balance-=100;s.hunger=Math.min(100,s.hunger+35);save('Такса с удовольствием поела.')}
function work(){if(s.hunger<15||s.joy<15){save('Нужно сначала поесть и поднять настроение.');return}s.balance+=150;s.hunger=Math.max(0,s.hunger-10);s.joy=Math.max(0,s.joy-5);save('Работа выполнена! Вы получили 150 жетонов.')}
function renameDog(){if(s.balance<500){save('Переименование стоит 500 жетонов.');return}let n=prompt('Новое имя таксы:',s.name);if(n&&n.trim()){s.balance-=500;s.name=n.trim().slice(0,20);save('Теперь вашу таксу зовут '+s.name+'.')}}
function tick(){let n=Date.now(),d=Math.floor((n-s.last)/600000);if(d>0){s.hunger=Math.max(0,s.hunger-d);s.joy=Math.max(0,s.joy-d);s.last+=d*600000;save('Пока тебя не было, такса немного проголодалась.')}}tick();save();setInterval(tick,30000);
</script></body></html>
