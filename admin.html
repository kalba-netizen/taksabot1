<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taksabot — Админка</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0d28a;color:#292b20;font:14px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:18px}.panel{background:#fff2c9;border:3px solid #292b20;box-shadow:4px 4px #7d633c;padding:14px;margin:12px 0;border-radius:8px}h1{font-size:22px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button{font:inherit;padding:10px;border:2px solid #292b20;border-radius:6px}input{min-width:0;max-width:100%}button{background:#91cd70;cursor:pointer}button.danger{background:#f19a85}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:#ffe29a;padding:12px;border:2px solid #292b20;border-radius:6px}.stat b{display:block;font-size:22px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{text-align:left;padding:8px;border-bottom:1px solid #bda879;font-size:12px}tr{cursor:pointer}tr:hover{background:#f8e3a7}.muted{opacity:.7;font-size:12px}#status{white-space:pre-wrap}.hidden{display:none!important}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.fields label{font-size:12px}.fields input{display:block;width:100%;margin-top:4px}@media(max-width:600px){table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><main>
<h1>🐕 Taksabot — админ-панель</h1><p class="muted">Доступ только владельцу. Открой страницу внутри StaticGram Mini App.</p>
<section class="panel"><div class="row"><label>Адрес Worker API <input id="api" placeholder="https://taksabot-api.НАЗВАНИЕ.workers.dev" style="width:min(480px,70vw)"></label><button id="connect">Подключить</button></div><p id="status">Укажи адрес Worker и нажми «Подключить».</p></section>
<div id="app" class="hidden">
<section class="panel"><h2>Статистика</h2><div class="stats" id="stats"></div></section>
<section class="panel"><h2>Игроки</h2><div class="row"><input id="search" placeholder="StaticGram ID, имя или username" style="flex:1"><button id="find">Найти</button><button id="all">Обновить</button></div><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Игрок</th><th>Такса</th><th>Баланс</th><th>Уровень</th><th>Был в игре</th></tr></thead><tbody id="players"></tbody></table></div></section>
<section class="panel hidden" id="detail"><h2>Карточка игрока</h2><div id="playerMeta" class="muted"></div><div class="fields"><label>Баланс<input id="balance" type="number" min="0"></label><label>Опыт XP<input id="xp" type="number" min="0"></label><label>Уровень<input id="level" type="number" min="0"></label></div><p id="dogMeta"></p><div class="row"><button id="savePlayer">Сохранить изменения</button><button id="blockPlayer">Заблокировать</button><button class="danger" id="resetPlayer">Сбросить таксу</button></div></section>
<section class="panel"><h2>Профессии</h2><div id="professions"></div><div class="fields"><label>ID<input id="jobId" placeholder="new_job"></label><label>Название<input id="jobName" placeholder="Новая работа"></label><label>Оплата<input id="jobPay" type="number" min="0"></label><label>Уровень<input id="jobLevel" type="number" min="0"></label></div><p><button id="saveJob">Сохранить профессию</button></p></section>
</div></main>
<script>
let API="",selected=null,initData="";
const $=id=>document.getElementById(id);
function auth(){const w=window.StaticGram&&window.StaticGram.WebApp;return w&&w.initData?w.initData:(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData)||""}
async function call(path,opts={}){if(!initData)throw Error("Не найдены подписанные данные StaticGram. Открой админку из Mini App.");const r=await fetch(API+path,{...opts,headers:{"Content-Type":"application/json","X-StaticGram-Init-Data":initData,...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}
function status(t){$("status").textContent=t}
async function connect(){API=$("api").value.trim().replace(/\/$/,"");if(!/^https:\/\//.test(API))throw Error("Укажи HTTPS-адрес Worker");initData=auth();await call("/api/admin/stats");$("app").classList.remove("hidden");status("Подключено. Доступ подтверждён.");await Promise.all([loadStats(),loadPlayers(),loadJobs()]);}
async function loadStats(){const {stats:s}=await call("/api/admin/stats");$("stats").innerHTML=[["Всего игроков",s.total],["Активны за 24 ч",s.active24],["Всего сосисок",s.sausages],["Средний уровень",Number(s.avg_level||0).toFixed(1)]].map(x=>'<div class="stat"><b>'+Number(x[1]||0).toLocaleString("ru-RU")+'</b>'+x[0]+'</div>').join("")}
async function loadPlayers(){const q=encodeURIComponent($("search").value.trim()),{players}=await call("/api/admin/players?q="+q);$("players").innerHTML=players.map(p=>'<tr data-id="'+p.id+'"><td>'+p.id+'</td><td>'+esc((p.first_name||"")+" "+(p.last_name||""))+'<br><small>@'+esc(p.username||"—")+'</small></td><td>'+esc(p.dog_name)+'</td><td>'+p.balance+'</td><td>'+p.level+'</td><td>'+new Date(p.last_seen).toLocaleString("ru-RU")+'</td></tr>').join("");[...$("players").querySelectorAll("tr")].forEach(tr=>tr.onclick=()=>openPlayer(tr.dataset.id))}
async function openPlayer(id){selected=id;const {player:p,save:s}=await call("/api/admin/player?id="+encodeURIComponent(id));$("detail").classList.remove("hidden");$("playerMeta").textContent="ID "+p.id+" • "+(p.first_name||"")+" "+(p.last_name||"")+" • @"+(p.username||"—");$("balance").value=p.balance;$("xp").value=p.xp;$("level").value=p.level;$("dogMeta").textContent=s?"Такса: "+(s.name||"Такса")+" • Голод: "+(s.hunger??"—")+" • Радость: "+(s.joy??"—")+" • Блокировка: "+(p.blocked?"да":"нет"):"Сохранения пока нет. Блокировка: "+(p.blocked?"да":"нет");$("blockPlayer").textContent=p.blocked?"Разблокировать":"Заблокировать";$("detail").scrollIntoView({behavior:"smooth",block:"start"})}
async function loadJobs(){const {professions}=await call("/api/admin/professions");$("professions").innerHTML=professions.map(p=>'<div class="row" style="padding:7px;border-bottom:1px solid #bda879"><b>'+esc(p.name)+'</b><span>'+p.pay+' 🌭 • уровень '+p.level+'</span><button data-id="'+p.id+'" data-name="'+esc(p.name)+'" data-pay="'+p.pay+'" data-level="'+p.level+'">Изменить</button></div>').join("");[...$("professions").querySelectorAll("button")].forEach(b=>b.onclick=()=>{$("jobId").value=b.dataset.id;$("jobName").value=b.dataset.name;$("jobPay").value=b.dataset.pay;$("jobLevel").value=b.dataset.level})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("connect").onclick=()=>connect().catch(e=>status("Ошибка: "+e.message));
$("find").onclick=()=>loadPlayers().catch(e=>status(e.message));$("all").onclick=()=>{$("search").value="";loadPlayers().catch(e=>status(e.message))};
$("savePlayer").onclick=async()=>{try{await call("/api/admin/player",{method:"POST",body:JSON.stringify({id:selected,balance:$("balance").value,xp:$("xp").value,level:$("level").value})});status("Данные игрока сохранены.");await loadPlayers();await openPlayer(selected)}catch(e){status(e.message)}};
$("blockPlayer").onclick=async()=>{try{const blocked=$("blockPlayer").textContent==="Заблокировать";await call("/api/admin/player",{method:"POST",body:JSON.stringify({id:selected,blocked})});await openPlayer(selected);status("Статус игрока обновлён.")}catch(e){status(e.message)}};
$("resetPlayer").onclick=async()=>{if(!selected||!confirm("Сбросить таксу и прогресс этого игрока?"))return;try{await call("/api/admin/player",{method:"POST",body:JSON.stringify({id:selected,reset:true})});await openPlayer(selected);await loadPlayers();status("Сохранение игрока сброшено.")}catch(e){status(e.message)}};
$("saveJob").onclick=async()=>{try{await call("/api/admin/professions",{method:"POST",body:JSON.stringify({id:$("jobId").value,name:$("jobName").value,pay:$("jobPay").value,level:$("jobLevel").value})});await loadJobs();status("Профессия сохранена.")}catch(e){status(e.message)}};
try{const w=window.StaticGram&&window.StaticGram.WebApp;if(w){w.ready&&w.ready();w.expand&&w.expand()}}catch(e){}
</script></body></html>
